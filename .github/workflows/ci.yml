name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # 동시성 테스트(Task 018)가 락 대기로 멈추면 기본값 360분까지 러너를 점유하므로 상한을 둔다.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tikkit-back
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: tikkit-back/build/reports/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tikkit-front
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tikkit-front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # 실제 BE(dev 프로필) + DB + FE를 띄워서 예매 핵심 흐름을 브라우저로 검증한다.
  # DB를 매번 새로 만들기 때문에 시드 날짜(판매중 공연)가 항상 유효하다.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          # application-dev.yml의 기본값과 같게 맞춘다 (DB_URL 등을 따로 넘기지 않아도 붙는다)
          POSTGRES_DB: tikkit_db
          POSTGRES_USER: tikkit_user
          POSTGRES_PASSWORD: tikkit_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tikkit_user -d tikkit_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build backend jar
        working-directory: tikkit-back
        run: ./gradlew bootJar -x test

      - name: Start backend (dev profile)
        working-directory: tikkit-back
        run: |
          # -plain.jar은 의존성이 빠진 jar이라 제외한다
          JAR=$(ls build/libs/*.jar | grep -v plain | head -n 1)
          nohup java -jar "$JAR" > "$RUNNER_TEMP/backend.log" 2>&1 &

      - name: Wait for backend
        # 비로그인 GET이 열려 있는 공연 목록 API로 기동 여부를 확인한다
        run: |
          curl --silent --show-error --fail \
            --retry 60 --retry-delay 2 --retry-connrefused --retry-all-errors \
            "http://localhost:8080/api/v1/performances?size=1" > /dev/null

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tikkit-front/package-lock.json

      - name: Install frontend dependencies
        working-directory: tikkit-front
        run: npm ci

      - name: Install Playwright browser
        working-directory: tikkit-front
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: tikkit-front
        run: npm run build

      - name: Run E2E tests
        # FE 서버는 playwright.config.ts의 webServer가 `npm run start`로 띄운다
        working-directory: tikkit-front
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tikkit-front/playwright-report

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-backend-log
          path: ${{ runner.temp }}/backend.log
