name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # 동시성 테스트(Task 018)가 락 대기로 멈추면 기본값 360분까지 러너를 점유하므로 상한을 둔다.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tikkit-back
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: tikkit-back/build/reports/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tikkit-front
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tikkit-front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # 실제 BE(dev 프로필) + DB + FE를 띄워서 예매 핵심 흐름을 브라우저로 검증한다.
  # DB를 매번 새로 만들기 때문에 시드 날짜(판매중 공연)가 항상 유효하다.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          # application-dev.yml의 기본값과 같게 맞춘다 (DB_URL 등을 따로 넘기지 않아도 붙는다)
          POSTGRES_DB: tikkit_db
          POSTGRES_USER: tikkit_user
          POSTGRES_PASSWORD: tikkit_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tikkit_user -d tikkit_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build backend jar
        working-directory: tikkit-back
        run: ./gradlew bootJar -x test

      - name: Start backend (dev profile)
        working-directory: tikkit-back
        run: |
          # -plain.jar은 의존성이 빠진 jar이라 제외한다
          JAR=$(ls build/libs/*.jar | grep -v plain | head -n 1)
          nohup java -jar "$JAR" > "$RUNNER_TEMP/backend.log" 2>&1 &

      - name: Wait for backend
        # actuator 도입(Task 025)으로 도메인 엔드포인트 대신 헬스 엔드포인트를 쓴다.
        # /actuator/health는 DataSourceHealthIndicator를 포함하므로 UP이면 Hikari 커넥션과
        # Flyway 마이그레이션까지 끝났다는 뜻이다 — 기존 보증과 같다.
        # --fail + --retry-all-errors라 기동 중 503(DOWN)도 재시도 대상이 된다.
        run: |
          curl --silent --show-error --fail \
            --retry 60 --retry-delay 2 --retry-connrefused --retry-all-errors \
            "http://localhost:8080/actuator/health" > /dev/null

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tikkit-front/package-lock.json

      - name: Install frontend dependencies
        working-directory: tikkit-front
        run: npm ci

      - name: Install Playwright browser
        working-directory: tikkit-front
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: tikkit-front
        run: npm run build

      - name: Run E2E tests
        # FE 서버는 playwright.config.ts의 webServer가 `npm run start`로 띄운다
        working-directory: tikkit-front
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tikkit-front/playwright-report

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-backend-log
          path: ${{ runner.temp }}/backend.log

  # Dockerfile이 조용히 썩는 것을 막는다 — 빌드만 하고 레지스트리에 푸시하지 않는다.
  # GHCR 푸시와 VM 배포는 Task 034 범위다.
  docker-build:
    runs-on: ubuntu-latest
    # BE는 컨테이너 안에서 Gradle 의존성을 처음부터 받으므로 frontend 잡보다 오래 걸린다.
    timeout-minutes: 20
    strategy:
      # 한쪽이 깨져도 나머지 Dockerfile 상태를 같은 실행에서 보고 싶다
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: tikkit-back
          - name: frontend
            context: tikkit-front
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          # 로컬 데몬에 적재하지 않는다 — 빌드 성공 여부만 보면 되고,
          # load는 러너 디스크에 수백 MB를 쓴다.
          load: false
          tags: tikkit-${{ matrix.name }}:ci
          # GHA 캐시. scope를 나누지 않으면 두 이미지가 같은 키를 두고 서로 덮어쓴다.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
