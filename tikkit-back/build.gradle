plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.tikkit'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Boot 4에서 spring-boot-starter-web이 -webmvc로 개명됐다 (WebFlux와 이름을 대칭시킨 것)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    runtimeOnly 'org.postgresql:postgresql'

    // Flyway (스키마 마이그레이션)
    // Boot 4부터는 flyway-core를 직접 넣는 방식이 지원되지 않고 스타터가 필수다.
    // 스타터는 flyway-core까지만 가져오고 DB별 모듈은 가져오지 않는다 — 빼면 기동이
    // `FlywayException: Unsupported Database: PostgreSQL 15.x`로 깨진다(의존성 누락인데
    // 메시지는 DB 버전 문제처럼 읽힌다).
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // QueryDSL (Jakarta EE 11 / Spring Boot 4.x 호환 - jakarta 분류자 필수)
    // Hibernate 7이 Jakarta Persistence 3.2를 쓰므로 jakarta 분류자가 아니면 동작하지 않는다.
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // MyBatis (통계/리포트/배치/벤더 특화 SQL용). 4.1.x가 Spring Boot 4.1 대응 라인이다.
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'

    // springdoc-openapi (Spring Boot 4용은 3.x 계열. 2.x는 Boot 3 전용이라 올려야 한다)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

    // Redisson (Redis 클라이언트). Task 020 분산 락 비교 실험에서 도입하고
    // Task 029(캐싱)·031(대기열)에서 계속 쓴다. redisson-spring-boot-starter를 쓰지 않은 이유는
    // docs/improvements/003-redis-distributed-lock.md 참조 — 자동설정이 기동 시점에 즉시 연결해서
    // Redis가 없으면 컨텍스트 기동 자체가 깨진다.
    // 4.x로 올린 이유: 3.50.0은 netty 4.1을 요구하는데 Boot 4가 관리하는 netty는 4.2다.
    implementation 'org.redisson:redisson:4.8.0'

    // Spring Session Data Redis (Task 026). 세션을 JVM 메모리가 아니라 Redis에 둬서
    // BE가 2대여도 같은 세션을 보게 한다.
    //
    // 주의: 이 스타터는 spring-boot-starter-data-redis(Lettuce)를 끌고 온다. Redisson을
    // raw 라이브러리로 쓴 이유(003: 자동설정이 기동 시점에 즉시 연결한다)와 같은 문제가
    // 재발할 수 있어서, application.yml에서 DataRedisAutoConfiguration을 **항상 제외**하고
    // tikkit.auth.session-store=redis일 때만 SessionRedisConfig가 연결 팩토리를 직접 만든다.
    // 그러면 Spring Session 자동설정의 @ConditionalOnBean(RedisConnectionFactory)이
    // 따라오므로 프로퍼티 한 개로 세션 저장소 전체가 켜지고 꺼진다.
    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'

    // ShedLock (Task 026). BE가 2대가 되면 @Scheduled 배치가 양쪽에서 돈다.
    //
    // 7.x를 쓴다 — README 호환 매트릭스에서 Spring Boot 4.x를 테스트한 라인이 7.x뿐이다
    // (6.x는 3.5/3.4까지). Boot BOM이 관리하지 않는 의존성이라 버전을 직접 고정한다.
    //
    // provider를 Redis가 아니라 JDBC로 고른 이유 둘:
    // 1) 세션 전략으로 JWT를 채택하면 Redis가 스택에서 사라지는데, Redis provider면 그때
    //    배치가 같이 깨진다. DB는 어느 전략에서도 항상 있다
    // 2) JDBC provider만 usingDbTime()을 제공한다 — 락 판정에 **DB 서버 시계**를 써서
    //    노드 간 시계 차이를 아예 제거한다. ShedLock의 알려진 함정 중 하나가
    //    "노드 시계 차이가 lockAtLeastFor보다 크면 중복 실행된다"인데 그걸 원천 차단한다
    implementation 'net.javacrumbs.shedlock:shedlock-spring:7.10.1'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.10.1'

    // Spring Cache (Task 029). @EnableCaching·@Cacheable 자체는 spring-context에 있지만,
    // CacheAutoConfiguration/CacheProperties를 담은 spring-boot-cache 모듈이 없으면
    // spring.cache.* 바인딩과 CacheManager 자동설정이 아예 안 올라온다.
    // RedisCacheManager는 spring-data-redis(세션 스타터가 끌고 온다) 안에 이미 있다.
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // Caffeine (Task 029 비교 실험군). 로컬 캐시와 Redis를 같은 Spring Cache 추상화 위에서
    // CacheManager 빈만 갈아끼워 비교한다. 버전은 Boot BOM이 관리한다.
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // 모니터링 (Task 025). starter-actuator가 spring-boot-starter-micrometer-metrics까지
    // 끌고 오므로 메트릭 스타터를 따로 선언하지 않는다.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // /actuator/prometheus를 켜는 레지스트리. 버전은 micrometer-bom이 관리한다(1.17.1).
    // micrometer-registry-prometheus-simpleclient는 구 Prometheus 클라이언트(0.16) 라인이라 쓰지 않는다 —
    // 자동설정이 신 패키지(io.micrometer.prometheusmetrics.PrometheusMeterRegistry)를 보므로
    // 그쪽을 고르면 /actuator/prometheus가 아예 뜨지 않는다.
    // 코드에서 MeterRegistry 인터페이스만 쓰므로 runtimeOnly로 둔다.
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // Boot 4에서 테스트 지원이 기술별 스타터로 쪼개졌다. spring-boot-starter-test는
    // 이 스타터들이 전이 의존으로 끌고 오므로 따로 선언하지 않는다.
    // AssertJ·Mockito도 버전을 고정하지 않고 BOM에 맡긴다 (고정하면 JUnit 버전과 어긋날 수 있다).
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Testcontainers (레포지토리/통합 테스트용 실제 PostgreSQL)
    // 2.0에서 아티팩트명이 testcontainers-<module> 꼴로 전부 바뀌었다.
    // @Testcontainers JUnit 확장을 쓰지 않고 AbstractContainerTest가 수동 싱글턴으로 띄우므로
    // testcontainers-junit-jupiter는 넣지 않는다.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
}
