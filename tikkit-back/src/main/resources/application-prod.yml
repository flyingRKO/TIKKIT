# 운영(컨테이너) 프로필. Task 024에서 신설.
# dev와의 차이는 세 가지다 — datasource 기본값을 주지 않고, 시드를 환경변수로 토글하고,
# 개발용 노출(swagger, SQL 로그)을 끈다.
spring:
  datasource:
    # 기본값을 일부러 주지 않는다. dev는 ${DB_URL:jdbc:postgresql://localhost:5432/tikkit_db}처럼
    # fallback이 있지만, 운영에서 같은 짓을 하면 환경변수 누락이 "localhost의 엉뚱한 DB를
    # Flyway로 건드리는" 사고가 된다. 플레이스홀더 미해결로 기동이 실패하는 쪽이 안전하다.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    # dev에서 켜둔 것들을 끈다 (application.yml에는 없는 값이라 명시적으로 false)
    show-sql: false
    open-in-view: false

  flyway:
    # 기본값은 운영 기준(마이그레이션만). Task 024의 완료 기준인 "prod 이미지로 e2e 3개 통과"를
    # 확인할 때만 .env의 FLYWAY_LOCATIONS로 classpath:db/migration,classpath:db/seed를 준다.
    #
    # 주의: db/seed의 버전이 V1_1, V4_1, V5_1로 db/migration 사이에 끼어 있다. 시드를 켠 채로
    # 만든 스키마에 시드 없는 설정으로 붙으면 Flyway가 "applied migration not resolved locally"로
    # 기동을 깬다. 값을 바꿀 땐 볼륨을 비워야 한다 (docker compose ... down -v).
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}

# springdoc 운영 비활성화 (Task 026_1에서 이 Task로 넘어온 항목).
# springdoc 3.x가 /swagger-ui.html을 기본 활성화한다는 경고를 띄우는데, 운영에서 API 스펙과
# Try it out UI를 열어둘 이유가 없다. 끄면 SecurityConfig의 swagger permitAll은 404로 떨어져
# 무해해지므로 SecurityConfig는 건드리지 않았다.
# 환경변수 토글로 두지 않은 이유: 운영에서 켤 시나리오가 없고, 뚫어두면 그게 사고 경로가 된다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    # Boot 기본값(root=INFO)과 같은 레벨이지만, "어디를 조정하면 되는지"를 보이게 적어둔다.
    # 구조화 로깅과 파일 출력은 Task 025(모니터링) 범위다.
    root: info
    com.tikkit: info
