spring:
  # Micrometer의 공통 태그와 구조화 로그의 service.name으로 쓰인다 (Task 025).
  application:
    name: tikkit-api

  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    locations: classpath:db/migration

  # Spring Session Data Redis (Task 026)
  autoconfigure:
    exclude:
      # 이 자동설정은 프로퍼티가 없어도 localhost:6379를 기본값으로 RedisConnectionFactory를
      # 만든다. 그러면 Spring Session 자동설정의 @ConditionalOnBean(RedisConnectionFactory)이
      # 항상 충족되어 **세션 저장소를 끌 방법이 없어진다**.
      # Boot 4에는 spring.session.store-type 같은 저장소 선택 프로퍼티도, 비활성화 스위치도 없다
      # (스타터를 넣는 것 자체가 선택이라는 설계다).
      # 그래서 항상 제외하고, 세션·캐시 중 하나라도 redis일 때만 RedisConnectionConfig가
      # 팩토리를 직접 만든다 — Task 020이 Redisson 스타터를 피한 것과 같은 패턴이다.
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      # 위를 제외하면 이것도 같이 제외해야 한다. Spring Data Redis 리포지토리 지원이
      # redisReferenceResolver 빈을 만들면서 **`redisTemplate`을 이름으로** 찾는데,
      # 그 빈을 만들던 게 방금 제외한 DataRedisAutoConfiguration이다.
      # 증상은 "No bean named 'redisTemplate' available"로, 세션과 아무 관계없어 보인다.
      # 우리는 Redis 리포지토리(@RedisHash 등)를 쓰지 않으므로 잃는 것이 없다.
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration

  session:
    data:
      redis:
        # Boot 4에서 접두사가 spring.session.redis.* -> spring.session.data.redis.*로 바뀌었다.
        # 구 표기를 쓰면 **조용히 무시된다**(바인딩 실패가 아니라 그냥 안 먹는다).
        namespace: tikkit:session
        # 기본값은 default(RedisSessionRepository)인데 indexed를 고른다.
        #
        # 이유는 비교표의 "강제 로그아웃(권한 회수) 가능 여부" 칸이다. 특정 회원의 세션을
        # 전부 찾아 지우려면 FindByIndexNameSessionRepository.findByPrincipalName()이 필요하고,
        # 그 API는 indexed 전용이다. default는 세션 조회 색인이 없다.
        #
        # 대가: indexed는 기동 시점에 CONFIG SET으로 keyspace notification을 켜므로
        # **Redis가 없으면 컨텍스트 기동이 깨진다**. Task 020이 Redisson 스타터를 피한 이유(003 3절)와
        # 같은 모양의 비용을 여기서는 의도적으로 받는 것이다. compose가 이미
        # depends_on: redis service_healthy를 걸고 있어 기동 순서는 보장된다.
        repository-type: indexed

server:
  # nginx 뒤에 서면(Task 026) 애플리케이션이 보는 원격 주소는 전부 nginx 컨테이너 IP이고
  # 스킴은 http다. framework 전략은 스프링의 ForwardedHeaderFilter를 등록해
  # X-Forwarded-For/Proto/Host를 request에 반영한다.
  #
  # 주의: 이 설정은 "앞단 프록시를 신뢰한다"는 선언이다. 지금은 nginx만이 BE에 닿을 수 있는
  # compose 네트워크라 안전하지만, BE 포트가 밖으로 열리면 클라이언트가 헤더를 위조해
  # 자기 IP를 바꿔 말할 수 있다. 그래서 compose에서 backend1/2의 호스트 포트를 닫았다.
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        # 이름을 명시한다 (Task 026). 지금까지는 Tomcat 기본값이 우연히 JSESSIONID였지만,
        # Spring Session이 끼면 DefaultCookieSerializer의 기본값인 SESSION으로 바뀐다.
        # 그러면 tikkit-front/lib/api/auth.ts의 /JSESSIONID=([^;]+)/ 파싱이 null이 되어
        # **로그인이 조용히 실패한다**(200은 그대로 내려오고 쿠키만 저장되지 않는다).
        #
        # Boot의 SessionAutoConfiguration이 server.servlet.session.cookie.*를 Spring Session의
        # DefaultCookieSerializer로 매핑해준다. 그래서 CookieSerializer 빈을 직접 만들면 안 된다 —
        # 그 자동 매핑이 @ConditionalOnMissingBean이라 http-only·same-site까지 같이 날아간다.
        #
        # max-age는 일부러 주지 않는다. 주면 세션 쿠키가 영속 쿠키로 바뀌어 전략 비교의 변수가 늘어난다.
        name: JSESSIONID
        http-only: true
        same-site: lax

tikkit:
  # 인증 상태를 어디에 두는가 (Task 026). memory | redis
  #
  # **운영은 redis다**(docker-compose.prod.yml의 기본값). BE가 2대 이상이면 memory는
  # 세션 불일치가 난다 — 같은 쿠키로 /members/me를 반복하면 200과 401이 섞인다.
  #
  # 여기 기본값을 memory로 둔 이유: Redis 없이도 기동·테스트가 돌아야 한다는 기존 결정을
  # 지키기 위해서다(docs/improvements/003-redis-distributed-lock.md 3절). 로컬 개발과
  # 통합 테스트 137개가 Redis를 띄우지 않고 그대로 돈다.
  #
  # 전략별 빈 선택은 AuthStrategyConfig 한 곳에서 한다.
  # JWT도 같은 토글로 구현해 비교했고 측정 후 제거했다 — docs/improvements/005-session-scaling.md
  auth:
    session-store: ${AUTH_SESSION_STORE:memory}

  # 허용 origin. 콤마로 여러 개를 줄 수 있다 (WebConfig가 String[]로 받는다).
  # 기본값이 dev 프론트엔드라 로컬 개발·테스트는 설정 없이 그대로 돌아간다.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  # 조회 캐시 (Task 029). none | redis
  #
  # 기본값 none인 이유는 session-store와 같다 — Redis 없이도 기동·테스트가 돌아야 한다
  # (docs/improvements/003-redis-distributed-lock.md 3절). none이면 NoOpCacheManager가 올라가서
  # @Cacheable이 전부 통과만 하므로, 어노테이션을 지우지 않고도 캐시가 완전히 꺼진다.
  # "캐시 없는 기준선"을 언제든 다시 잴 수 있게 하려는 뜻도 있다.
  #
  # 캐시 대상은 공연 목록·상세와 등급 가격뿐이다. 좌석맵은 캐싱을 기각했다 —
  # 항목이 2,000석에 337,885바이트라서 Redis 왕복·역직렬화가 원래 쿼리보다 비쌌고,
  # 적중률 99.97%에서도 캐시를 켠 쪽이 느렸다 (docs/improvements/008-caching.md 4절).
  #
  # ★ 008의 채택 근거를 Task 033이 증명했다 ★
  # 008은 "채택 근거가 지연이 아니라 용량이고 그 검증은 033이 한다"고 적어뒀다(BE CPU 4.2%의
  # 저부하에서 재서 아무것도 가리지 못했다). 포화까지 올려 재보니 한계 처리량이
  #     browse        7,400 -> 10,150 req/s  (+37%)
  #     browse-skewed 7,537 -> 10,655 req/s  (+41%)
  # 였다. 적중률 99.9%이고, 같은 VU에서 p95도 같이 내려간다(VU 150: 55.28 -> 44.31ms).
  # 치우친 분포가 더 유리한 것도 방향이 맞다 — 핫 키가 집중되면 적중률이 올라간다.
  #
  # 좌석맵은 캐시 토글에 영향받지 않는다(842 -> 846 req/s, +0.4%). 캐시 대상이 아니라서
  # 당연하지만, "캐시를 켜면 좌석맵이 손해를 본다"가 아니라는 확인도 된다.
  #
  # 기본값을 none으로 유지하는 이유는 위와 같다 — 기준선을 다시 잴 수 있어야 한다.
  #
  # 주의: 쿼리 카운트 테스트가 이 값에 묶여 있다. 캐시가 켜지면 히트 경로의 문장 수가 줄어서
  # *QueryCountTest는 none/redis를 나눠 고정한다.
  cache:
    type: ${CACHE_TYPE:none}

    # 좌석맵 조회 전략 (Task 036). single | split | local
    #
    # 세 값이 측정 군 A·B·C다. 기본값 single은 현행 단일 쿼리이고, before가 사라지지 않게
    # 기본으로 둔다 - CACHE_TYPE·QUEUE_ENABLED와 같은 이유다.
    #
    #   single  단일 쿼리. 좌석맵 p95 6.63ms / 포화 775 req/s (008 4.1절, 012 7.1절)
    #   split   배치·상태 두 쿼리로 분리, 캐시 없음. **순손실이다**(8.62ms, +30%).
    #           분리 손해와 캐시 이득을 갈라 귀속하기 위한 측정 군으로만 존재한다
    #   local   분리 + 배치를 Caffeine에 둔다. 저부하 4.98ms / 적중률 97.0% (008 4.1절)
    #
    # 왜 다시 재는가: 029는 저부하 p95로 "로컬이 가장 빠르다"까지 쟀지만 힙 용량과 분산
    # evict 때문에 안 골랐다. 이 캐시는 불변 필드만 담아서 evict가 필요 없고, 남은 질문은
    # 포화 구간이다 - 008 4.2절이 "DB가 포화에 가까워지면 뒤집힐 수 있다"를 반례 조건으로
    # 남겼고 040이 벽을 postgres CPU 4코어로 특정했다.
    #
    # 판정이 끝나면 이 토글은 사라진다. 채택이면 고른 전략만 남기고 기각이면 전부 되돌린다
    # (improvements/README.md 교훈 5).
    seatmap: ${SEATMAP_STRATEGY:single}

    # 좌석맵 로컬 캐시가 보관할 회차 수 상한. 008이 든 기각 근거 중 "힙 용량"이 아직
    # 유효해서 측정 축으로 뺐다 - 2,000석 회차 하나가 Redis 직렬화 기준 337,885바이트였고,
    # 008은 회차 3,000개면 1.15GB라고 적었다. LRU가 핫한 회차만 남기므로 그 근거를
    # 정책으로 다룰 수 있는지를 이 값으로 잰다.
    seatmap-max-entries: ${SEATMAP_MAX_ENTRIES:200}

    # 좌석맵 로컬 캐시 TTL. 캐시 대상이 불변이라 무효화용이 아니라 **안전망**이다 -
    # 좌석 구성을 마이그레이션으로 바꿨을 때 재기동 없이 따라오게 하는 정도의 의미다.
    # gradePrices의 10분과 같은 성격이다.
    seatmap-ttl: ${SEATMAP_TTL:10m}

  # 대기열 (Task 031). ZSET 기반 입장 제어.
  #
  # 기본값 false인 이유는 session-store=memory, cache.type=none과 같다: Redis 없이도 기동·테스트가
  # 돌아야 한다 (docs/improvements/003-redis-distributed-lock.md 3절). false면
  # DisabledQueueGateway가 올라가 전부 통과시키므로, 호출부(인터셉터·ReservationService)를
  # 지우지 않고도 기능이 완전히 꺼진다 — NoOpCacheManager와 같은 구조다.
  #
  # 이 토글은 "대기열 기능이 이 애플리케이션에 있는가"이고, schedules.queue_enabled는
  # "이 회차에 줄을 세우는가"다. 전자가 꺼져 있으면 후자가 true여도 아무 일도 일어나지 않는다.
  queue:
    enabled: ${QUEUE_ENABLED:false}

    # 한 틱에 입장시킬 인원. **Task 033에서 근거를 만들었다** (전에는 임시값이었다).
    #
    # ★ 상한: 보호 경로의 포화에서 역산한다 ★
    #   R_sat = 120 (도착률/s). 그 지점에서 좌석 조회 + 선점이 p95 200ms 안에 처리된다
    #           (309 req/s, 122 MB/s. 140/s에서 p95가 64.5 -> 214.3ms로 꺾인다)
    #   안전계수 0.7 (상태 API 몫 + 새로고침 분산)
    #   => 초당 입장 인원 상한 = 120 * 0.7 = 84명/s
    #
    # ★ 하한: 재고가 정한다 ★
    #   10,000석 / 2.5석(1인 평균) / 600초(목표 판매 시간) = 6.7명/s
    #
    # 그래서 [6.7, 84] 안이면 된다. 50을 유지하는 이유는 양쪽에 여유가 있고(10,000석을 80초에
    # 판다) 측정에서 실제로 p95를 지켰기 때문이다.
    #
    # ★★ 이 값은 전역이 아니라 회차당이다 ★★
    # QueueAdmissionScheduler가 queue_enabled가 켜진 회차를 **전부 순회**하면서 회차마다
    # 이 인원을 입장시킨다. 즉
    #       초당 입장 인원 = admit-batch-size * 켠 회차 수 / admit-interval
    # 이므로 **회차를 2개 켜면 100명/s가 되어 위 상한 84를 넘는다.** 50은 회차 1개를 전제한
    # 값이다. 여러 회차를 동시에 켤 거면 batch * N <= 84를 지켜야 한다.
    #
    # ★ 큰 배치는 대기열을 무력화한다 — 실측했다 ★
    # 배치 5/10/25/50/100에서 실제 입장 속도가 공칭값의 1.000~1.033배로 따라갔다. 즉 배치를
    # 키우면 그만큼 그대로 흘러들어가고, 좌석 API에 걸리는 상한도 같이 올라간다.
    # 부수 효과로 Task 031이 적어둔 "fixedDelay라 ETA가 낙관적이다"는 **원인이 틀렸다**는 것도
    # 드러났다 — 실제 입장 속도는 공칭값과 같고, ETA가 낙관적인 원인은 유령(브라우저를 닫고
    # waiting에 남은 사람)이다.
    #
    # ★ 줄이면 화면의 예상 대기시간이 그만큼 길어진다 ★
    # RedisQueueGateway.estimatedWaitSeconds()가 rank / (admit-batch-size / admit-interval)이다.
    # 좌석 API를 지키려고 배치를 줄이면 사용자에게 바로 보이는 숫자가 커진다.
    admit-batch-size: ${QUEUE_ADMIT_BATCH_SIZE:50}

    # 입장 스케줄러 틱 간격.
    #
    # fixedDelay라 실제 주기는 이 값 + 실행 시간이다. 그래서 "표시보다 늦게 입장한다"고
    # 적어뒀었는데, **Task 033 측정에서 틀린 설명으로 드러났다** — 배치 5/10/25/50/100에서
    # 실제 입장 속도가 공칭값의 1.000~1.033배였다. 작업이 수 ms라 실행 시간이 1초에 묻힌다.
    # 예상 대기시간이 낙관적인 원인은 fixedDelay가 아니라 **유령**이다(브라우저를 닫아도
    # waiting에 남아 그 틱의 슬롯을 먹는다).
    #
    # **주의: 이 값을 크게 바꾸면 QueueAdmissionScheduler의 @SchedulerLock(lockAtLeastFor)도
    # 같이 봐야 한다.** 어노테이션에 계산식을 쓸 수 없어서 두 값이 수동으로 묶여 있다.
    # 안 맞추면 "설정은 5초인데 실제로는 1초마다 입장"이 되고, 증상은 "예상 대기시간이 계속
    # 틀리다"로만 나타난다.
    admit-interval: ${QUEUE_ADMIT_INTERVAL:1s}

    # 입장권 수명. 선점 홀드(Reservation.HOLD_DURATION = 10분)보다 길어야 한다 — 짧으면
    # 자기가 잡은 좌석을 결제하지 못하는 모순이 생긴다. 보호된 API를 호출하면 슬라이딩 연장된다.
    pass-ttl: ${QUEUE_PASS_TTL:15m}

    # 대기·활성 ZSET 키 자체의 수명. 쓰기마다 다시 걸어서 "아무도 안 쓰는 큐는 사라진다"를
    # 만든다. 없으면 끝난 회차의 ZSET이 영구히 남아 회차 수에 비례해 누적된다.
    key-ttl: ${QUEUE_KEY_TTL:2h}

    # schedules.queue_enabled 스냅샷 수명. 플래그를 켜고 이 시간만큼은 일부 인스턴스가
    # 통과시킬 수 있다. 플래그에 쓰기 API가 없고 사람이 SQL로 바꾸는 값이라 괜찮다.
    flag-cache-ttl: ${QUEUE_FLAG_CACHE_TTL:10s}

  # Redis 주소 (Task 020에서 도입). 세션·캐시·대기열이 이 하나를 공유한다 —
  # "Redis가 어디 있나"는 하나의 사실이고, 두 벌로 두면 한쪽만 고치는 사고가 생긴다.
  #
  # 연결을 켜는 토글은 용도별로 따로 있다 (auth.session-store / cache.type / queue.enabled).
  # 전부 기본값이 "연결하지 않음"이라 Redis 없이도 기동·테스트가 된다.
  #
  # Task 020이 쓰던 redis.enabled(Redisson 클라이언트)는 Task 031에서 제거했다 — 분산 락을
  # 기각한 뒤로 주입처가 0개였고, 대기열은 Lettuce + StringRedisTemplate으로 간다
  # (docs/improvements/003-redis-distributed-lock.md 8절이 "Redis를 락이 아니라 원래 잘하는
  # 일로 쓴다"고 예고한 그대로다).
  redis:
    address: ${REDIS_ADDRESS:redis://localhost:6379}

# 모니터링 (Task 025). Boot 4에서 management.endpoint.<id>.enabled가 제거되고
# management.endpoint.<id>.access(none/read-only/unrestricted)로 바뀌었다.
management:
  endpoints:
    access:
      # 기본을 차단으로 두고 아래에서 명시적으로 허용한 것만 연다. access가 none이면
      # 엔드포인트가 컨텍스트에서 아예 제거되므로, 나중에 누가 exposure.include를 "*"로
      # 바꿔도 env·heapdump·threaddump가 열리지 않는다 (2중 방어).
      default: none
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      access: read-only
    prometheus:
      access: read-only
  metrics:
    distribution:
      # 이게 없으면 _bucket 시리즈가 안 나오고 Grafana에서 histogram_quantile을 쓸 수 없다.
      #
      # management.metrics.distribution.percentiles(인스턴스가 미리 계산한 _quantile)를
      # 쓰지 않는 이유: 분위수는 수학적으로 합산이 불가능해서 여러 인스턴스 값을 하나로 못 묶는다.
      # BE가 2대가 되는 Task 026에서 쓸 수 없게 되므로 처음부터 버킷 방식으로 간다.
      percentiles-histogram:
        http.server.requests: true
      # 버킷 범위를 좁혀 시리즈 수를 줄인다 (기본은 1ns~30s 전 구간을 다 만든다).
      # 이 범위 밖의 값은 p95 정확도가 떨어진다.
      # 하한을 1ms로 둔다. 처음 5ms로 잡았더니 로컬 응답이 대부분 그보다 빨라서
      # 전부 첫 버킷에 들어갔고, histogram_quantile이 [0, 5ms]를 보간해 어떤 엔드포인트든
      # p95가 4.7ms 근처로 나왔다 — 값이 아니라 버킷 경계를 읽고 있던 것이다 (Task 025에서 실측).
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 10s
