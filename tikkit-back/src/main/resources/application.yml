spring:
  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    locations: classpath:db/migration

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

tikkit:
  # 허용 origin. 콤마로 여러 개를 줄 수 있다 (WebConfig가 String[]로 받는다).
  # 기본값이 dev 프론트엔드라 로컬 개발·테스트는 설정 없이 그대로 돌아간다.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  # Redis (Task 020에서 도입). 기본값을 false로 둬서 Redis 없이도 기동·테스트가 된다.
  # 쓰려면 docker-compose로 redis를 띄우고 REDIS_ENABLED=true로 실행한다.
  redis:
    enabled: ${REDIS_ENABLED:false}
    address: ${REDIS_ADDRESS:redis://localhost:6379}
