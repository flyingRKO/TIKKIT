spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tikkit_db}
    username: ${DB_USERNAME:tikkit_user}
    password: ${DB_PASSWORD:tikkit_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  # dev 프로필에서만 db/seed(개발용 시드 데이터)를 함께 로드한다.
  flyway:
    locations: classpath:db/migration,classpath:db/seed