spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tikkit_db}
    username: ${DB_USERNAME:tikkit_user}
    password: ${DB_PASSWORD:tikkit_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true