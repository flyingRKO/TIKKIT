# TIKKIT 리버스 프록시 / 로드밸런서 (Task 026).
#
# docker-compose.prod.yml의 nginx 서비스가 /etc/nginx/nginx.conf로 읽기전용 마운트한다.
#
# 경로 분기
#   /actuator  -> 404        (외부 차단. application-prod.yml:41이 이 Task로 넘긴 항목)
#   /api/      -> backend1/backend2
#   /          -> frontend:3000 (Next 서버)
#
# 한 가지 짚어둘 구조: 브라우저는 BE를 직접 호출하지 않고 Next 서버만 호출하는데
# (tikkit-front/lib/api/client.ts), 그 Next 서버도 API_BASE_URL=http://nginx로 설정돼
# 이 nginx를 거쳐 BE로 간다. 그래서 한 페이지 요청이 nginx를 두 번 지난다.
#   브라우저 -> nginx -> frontend -> nginx -> backend1 또는 backend2
# 세션 불일치가 "브라우저와 BE 사이"가 아니라 "Next 서버와 BE 사이"에서 생기는 이유다.
#
# 주의: upstream의 호스트명은 nginx 기동(또는 reload) 시점에 IP로 고정된다. resolve 파라미터를
# 안 썼으므로 backend 컨테이너를 재생성하면 nginx가 옛 IP를 물고 502를 뱉는다. 전략을 바꿔
# 컨테이너를 다시 만들 때는 `docker compose -f docker-compose.prod.yml restart nginx`를 같이 한다.
# 이걸 모르면 "Redis 세션이 안 된다"로 오진한다.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $upstream_addr와 세션 쿠키를 같이 남긴다. 세션 불일치의 증명이 이 한 줄로 끝난다 —
    # 같은 sess= 값인데 upstream이 갈리면서 상태코드가 200/401로 나뉘는 걸 눈으로 본다.
    log_format tikkit '$remote_addr [$time_local] "$request" $status '
                      'upstream=$upstream_addr sess=$cookie_JSESSIONID '
                      'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout tikkit;
    error_log  /dev/stderr warn;

    upstream tikkit_backend {
        # --- 분산 전략: 3가지를 번갈아 실측했다 (Task 026 3단계). 결론은 "sticky로는 안 된다" ---
        #
        # (1) 기본 라운드로빈 (현재 설정, 아래 둘 다 주석)
        #     같은 쿠키로 /members/me 40회 -> 1차 측정 200 20 / 401 20, 2차 측정 200 26 / 401 14.
        #     정확히 반씩은 아니다 — frontend 헬스체크(10초 주기)가 같은 upstream의 라운드로빈
        #     순번을 같이 소비해서 교대가 밀린다. 중요한 건 비율이 아니라
        #     **같은 sess= 값이 upstream에 따라 200과 401로 갈린다**는 것이다.
        #
        # (2) ip_hash  -> 불일치 0건이지만 로드밸런싱이 소멸한다
        #     같은 쿠키 40회 전부 200. 그런데 backend2가 받은 요청이 **0건**이었다.
        #     원인: nginx는 IPv4의 앞 3옥텟만 해시 키로 쓴다(공식 문서).
        #     Docker 네트워크가 /24 하나라 호스트(172.21.0.1)든 frontend 컨테이너(172.21.0.8)든
        #     전부 같은 버킷으로 간다. 클라이언트가 몇 개인지와 무관하게 한 대로 쏠린다.
        #     게다가 그 한 대를 내리면 거기 있던 세션은 전멸한다 — 되살려도 401이 그대로였다.
        #
        # (3) hash $cookie_JSESSIONID consistent  -> 라운드로빈보다 나쁘다. 401이 20/20이었다
        #     세션을 만드는 요청(로그인)에는 아직 그 쿠키가 없다는 순서 문제 때문이다.
        #     실측 로그: 로그인은 sess=- 로 빈 값이 해시돼 backend1로 갔고(거기 세션이 생김),
        #     이후 sess=DEE166... 을 들고 간 요청은 전부 backend2로 가서 401이 됐다.
        #     라운드로빈은 50%만 틀리는데 이쪽은 100% 틀린다.
        #
        # ip_hash;
        # hash $cookie_JSESSIONID consistent;

        # --- 장애 판정: max_fails를 끈다 (Task 039) ---
        #
        # 명시하지 않으면 nginx 기본값 max_fails=1 / fail_timeout=10s가 걸린다.
        # 그 기본값이 Task 036의 포화 측정에서 실제로 터졌다 (014 4.7절):
        # 타임아웃 1건으로 BE 한 대가 10초간 배제되고, 남은 1대에 부하가 2배로 가서
        # 그쪽도 배제되면 nginx가 요청을 즉시 502로 돌려준다.
        # 로그에 `no live upstreams` 977,264건 / 502 984,911건 / 504 11,735건이 찍혔고,
        # **처리량 지표는 400 -> 7,000 req/s로 17배 "개선"되어 보였다**
        # (요청이 일을 안 해서 수치가 좋아지는 전형. improvements/README.md 교훈 1).
        # 009 6.4절이 이미 같은 원인을 진단하고(1분간 502 285건) 범위 밖으로 이월한 항목이다.
        #
        # 값을 올리는 것(max_fails=5 같은)으로는 안 된다 — 트립 시점만 늦추고 터지는 모양은
        # 같다. 포화에서는 타임아웃이 그 임계값까지 금방 쌓이고, 트립한 뒤의 연쇄는 동일하다.
        #
        # **BE가 2대라서 "배제"의 이득이 0이다.** 셋 이상이면 한 대를 빼고 나머지로 버티는
        # 게 맞지만, 2대에서 1대를 빼면 남은 쪽 부하가 2배가 되어 같은 일이 반복된다.
        #
        # 끄더라도 진짜 죽은 BE는 우회된다 — proxy_next_upstream 기본값(error timeout)이
        # **요청 단위로** 다음 업스트림을 시도하므로, 죽은 쪽으로 간 요청은 그 자리에서
        # 살아 있는 쪽으로 넘어간다. 배제는 "다음 요청들까지 보내지 않는" 추가 장치일 뿐이다.
        # 잃는 것은 죽은 쪽으로 가는 커넥트 시도 1회의 비용이다.
        #
        # 한계: 이 판단은 "BE 2대 + 같은 호스트" 전제다. Task 034에서 인스턴스가 늘거나
        # 네트워크를 건너가면 배제의 이득이 생기므로 거기서 다시 본다.
        server backend1:8080 max_fails=0;
        server backend2:8080 max_fails=0;

        # keepalive를 켠다 (Task 027).
        #
        # Task 026에서는 꺼 둔 채로 측정했다. 처음에 "커넥션을 재사용하면 한쪽 BE에 붙어서
        # 재현이 약해진다"고 적었는데 그건 틀렸다 — nginx는 HTTP/1.1 프록시에서 **요청 단위로**
        # 업스트림을 고르므로 Next의 fetch가 커넥션을 유지해도 라운드로빈은 요청마다 돈다.
        #
        # 실제 영향은 반대쪽이다. keepalive가 없으면 nginx->BE가 매 요청 새 TCP라서
        # 핸드셰이크 비용이 지연 측정에 섞인다(004_3의 좌석맵 p95가 3.07ms 스케일이라 무시 못 한다).
        # Task 027에서 이 줄을 주석/해제해 양쪽을 재고 docs/improvements/006 7절에 남긴다.
        #
        # 32는 "워커당 유지할 유휴 커넥션 수"다. 동시 요청 상한이 아니다 — 넘치면 nginx가
        # 새 커넥션을 열고 응답 후 닫는다. BE가 2대이므로 워커당 대략 BE별 16개씩 잡힌다.
        keepalive 32;
    }

    upstream tikkit_frontend {
        server frontend:3000;
    }

    server {
        # **리스너가 둘이고, 80을 지우면 안 된다** (Task 039_1).
        #
        # 443을 더한 이유: HTTP/2를 브라우저로 재려면 TLS가 반드시 끼어야 한다. 브라우저는
        # 평문 HTTP/2(h2c)를 지원하지 않아서 `listen 80 http2;`로는 Lighthouse 측정이
        # 성립하지 않는다(009_1 6절이 그 경로를 적어 뒀는데 그게 틀렸다).
        #
        # 80을 남긴 이유: **k6 하네스 전체가 평문으로 들어온다.** load-test/k6/lib/config.js가
        # `BASE_URL || 'http://nginx'`이고 compose의 k6 서비스도 `BASE_URL: http://nginx`다.
        # 80을 지우거나 443으로 리다이렉트하면 036·039가 쓴 포화 측정이 전부 죽는다.
        # 그래서 브라우저 군(https)과 부하 군(http)이 한 스택에서 같이 산다 —
        # **이건 측정 장치의 구성이고 운영 설정이 아니다.** 운영에서는 80을 443으로 보낸다.
        #
        # HSTS(`Strict-Transport-Security`)를 넣지 않는 이유도 같은 쪽이다. localhost에 HSTS를
        # 심으면 브라우저가 그 호스트의 http 접근을 **다른 포트·다른 로컬 프로젝트까지**
        # 강제 업그레이드하고, 되돌리려면 브라우저 설정을 손대야 한다. 측정을 위해 개발
        # 기계에 그런 상태를 남기지 않는다.
        listen 80;
        listen 443 ssl;

        # nginx 1.25.1부터 `listen ... http2`는 deprecated다. 이 블록에 쓰면 기동 경고가 난다.
        # **이 한 줄이 측정의 독립변수다** — Task 039_1의 B군(TLS만)은 이것을 `off`로,
        # C군(TLS+HTTP/2)은 `on`으로 두고 재서 TLS 비용과 HTTP/2 이득을 갈랐다.
        #
        # 켰다고 믿지 말고 읽는다(교훈 10): 어느 군이 실제로 h2였는지는 이 줄이 아니라
        # scripts/lighthouse-runs.mjs가 회차마다 찍는 프로토콜 집계가 증명한다.
        http2 on;

        # 로컬 self-signed다. 만드는 법은 nginx/generate-local-cert.sh이고 산출물은
        # 커밋하지 않는다. 체인도 OCSP도 없어서 클라이언트가 경고를 넘겨야 한다
        # (Lighthouse는 --ignore-certificate-errors, Playwright는 ignoreHTTPSErrors).
        ssl_certificate     /etc/nginx/certs/localhost-cert.pem;
        ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # `ssl_session_cache`를 **일부러 켜지 않는다.** Lighthouse는 회차마다 새 Chrome
        # 프로필이라 세션 재사용이 생기지 않는데, 켜 두면 나중에 수치를 볼 때
        # "재사용이 섞였나"를 의심해야 한다. 운영에서는 켜는 쪽이 맞다.

        server_name _;

        # 좌석맵 응답이 **2,000석에서 237.9~248KB**다. 기본 버퍼(4k x 8 = 32k)로는 디스크
        # 임시파일로 떨어진다.
        #
        # 여기 있던 "약 59KB(004_3 측정)"는 좌석 규모가 커진 뒤로 낡은 수치였다. 그래서
        # 16 x 16k = 256KB가 응답에 **여유 16KB**뿐인 상태로 남아 있었고, Task 036의 포화
        # 로그에서 `an upstream response is buffered to a temporary file`이 좌석맵 요청마다
        # 찍혔다(014 4.7절). 009 6.2절이 같은 설정을 **저부하에서** 쟀을 때는 57만 줄 로그에
        # 0건이었다 — 즉 모자란 게 아니라 **포화에서만 터지는** 것이고, 저부하 측정으로는
        # 이 항목을 판정할 수 없다.
        #
        # 32 x 16k = 512KB로 올린다. 248KB 응답에 2배 여유다. 메모리는 커넥션당 필요한
        # 만큼만 잡으므로(상한이 아니라 상한선이다) VUS 300 포화에서 최악 150MB 수준이다.
        #
        # 한계: 10,000석 시드(009_2가 만든 것)는 응답이 약 1.2MB라 이 값으로도 넘친다.
        # 그 규모를 nginx 경유로 재는 Task가 생기면 여기서 다시 본다.
        proxy_buffer_size 16k;
        proxy_buffers     32 16k;

        # nginx 기본값(2 x proxy_buffer_size = 32k)을 명시만 한 것이다. 위 두 값과의 관계가
        # 보이지 않으면 "버퍼를 올렸는데 왜 그대로인가"를 여기서 의심하게 된다.
        # 이 값이 실제로 걸리는 것은 **클라이언트가 업스트림보다 느릴 때**인데, 여기서
        # 좌석맵의 클라이언트는 같은 호스트의 Next 서버라 그 조건이 아니다.
        proxy_busy_buffers_size 32k;

        proxy_http_version 1.1;

        # upstream keepalive의 전제조건이다 (Task 027). 빼먹기 쉬운데, 없으면
        # `keepalive 32;`를 켜도 아무 효과가 없다.
        #
        # 이유: 클라이언트가 보낸 Connection 헤더가 업스트림으로 그대로 전달된다.
        # 브라우저나 k6가 Connection: close를 보내면 nginx->BE 커넥션도 매번 닫히고,
        # 그러면 "켰는데 핸드셰이크 비용이 그대로"라는 오결론이 나온다.
        # 빈 문자열로 덮어써서 전달 자체를 막는다.
        proxy_set_header Connection "";

        # $host가 아니라 $http_host다. $host는 **포트를 버린다.**
        # Next의 Server Action은 origin 헤더와 host(또는 x-forwarded-host)를 비교해
        # 다르면 "Invalid Server Actions request."로 500을 낸다. 로그인·로그아웃이 전부
        # Server Action이라 여기 걸리면 로그인 자체가 깨지고, 메시지만 보고는 원인을 못 찾는다.
        #
        # 이 주석이 "지금은 80이라 같지만 포트를 옮기는 순간 갈린다"로 경고하던 그 변경을
        # Task 039_1이 실제로 했다(443 추가). **갈리지 않았다** — 80과 443은 각 스킴의 기본
        # 포트라 브라우저가 Host에 포트를 안 붙이고, origin도 `https://localhost`로 온다.
        # 그래서 비표준 포트(8443 등)를 쓰지 않는 것이 이 자리의 조건이다. 옮길 일이 생기면
        # https e2e(로그인·로그아웃)로 먼저 확인한다 — 그게 이 검증의 유일한 경로다.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx 자체 헬스체크용. compose healthcheck가 frontend/backend 상태에 묶이면
        # "프록시는 떴는데 unhealthy"가 되므로 업스트림을 타지 않는 경로를 따로 둔다.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # actuator는 프록시하지 않는다. Prometheus는 nginx를 거치지 않고 backend1:8080,
        # backend2:8080을 compose 네트워크로 직접 긁으므로 지표 수집에는 영향이 없다.
        # /actuator/health 하나만 막는 게 아니라 접두사 전체를 막는다 — 나중에 엔드포인트를
        # 하나 더 열어도 의도 없이 외부로 나가지 않는다 (SecurityConfig가 와일드카드를 안 쓴 것과 같은 이유).
        location /actuator {
            return 404;
        }

        location /api/ {
            proxy_pass http://tikkit_backend;
        }

        location / {
            proxy_pass http://tikkit_frontend;
        }
    }
}
