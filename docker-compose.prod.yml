# 로컬에서 "운영 이미지"로 전체 스택을 띄워 보는 compose (Task 024).
#
# tikkit-back/docker-compose.yml(개발 인프라: DB+Redis만)과는 별개이며 동시에 띄울 수 있다 —
# 컨테이너명·볼륨명·네트워크가 전부 다르고, 이쪽은 DB/Redis 포트를 호스트에 열지 않는다.
#
# 사용법:  cp .env.example .env && docker compose -f docker-compose.prod.yml up -d --build

name: tikkit-prod

# --- backend1/backend2 공유 설정 (Task 026) ---
# 두 인스턴스의 환경변수와 헬스체크가 **완전히 같아야** 한다. 한쪽만 다르면 이 Task가
# 측정하려는 "세션이 어디 있는가"가 아니라 설정 차이를 측정하게 된다. 앵커로 묶어서
# 한쪽만 고치는 실수를 구조적으로 막는다.
x-backend-env: &backend-env
  SPRING_PROFILES_ACTIVE: prod
  # 서비스명(postgres)이 compose 네트워크의 DNS 이름이다
  DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
  DB_USERNAME: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  # 로컬 e2e 검증에서는 시드를 켠다 (.env 참조). 운영이라면 비워 기본값을 쓴다.
  FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration}
  # 브라우저가 BE를 직접 호출하지 않으므로 실제로 발동하지 않는 설정이다.
  # nginx가 들어온 뒤로는 단일 origin이 되어 더더욱 쓰이지 않는다 (WebConfig 주석 참조).
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
  REDIS_ADDRESS: redis://redis:6379
  # 인증 상태를 어디에 두는가 (Task 026). memory | redis
  #
  # **기본값이 redis다.** BE가 2대라 memory면 세션 불일치가 난다 — 같은 쿠키로 요청을
  # 반복하면 200과 401이 섞인다. 재현을 보려면 일부러 memory로 띄운다.
  #
  # 주의: 이 값을 바꿔 컨테이너를 재생성하면 backend IP가 바뀌어 nginx가 옛 IP를 물고
  # 502를 뱉는다. 반드시 `restart nginx`를 같이 한다 (nginx/nginx.conf 상단 주석).
  AUTH_SESSION_STORE: ${AUTH_SESSION_STORE:-redis}
  # 조회 캐시 (Task 029). none | redis
  #
  # 기본값을 none으로 둔다 — 캐시는 before/after를 비교해서 채택을 판정하는 대상이라,
  # 스택을 띄우는 것만으로 켜지면 "캐시 없는 기준선"을 다시 재기 어렵다.
  # 캐시를 켜고 재려면 CACHE_TYPE=redis로 띄운 뒤 nginx를 재시작한다.
  #
  # 캐시 대상은 공연 목록·상세와 등급 가격뿐이다. 좌석맵은 캐싱을 기각했다 —
  # 적중률 99.97%에서도 캐시를 켠 쪽이 느렸다 (docs/improvements/008-caching.md 4절).
  CACHE_TYPE: ${CACHE_TYPE:-none}

  # 좌석맵 조회 전략 (Task 036). single | local
  #
  # **local이 채택안이다** - 포화 768.6 -> 995.1 req/s(+29.5%)에 postgres CPU가
  # 390.1% -> 144.6%(-62.9%)다. 적중률 99.4%, DB 내부 실행 시간이 요청당 14.85 -> 1.98ms.
  # 029가 Redis로 기각한 것과 결론이 다른 이유는 저장소다(로컬에는 직렬화도 왕복도 없다).
  #
  # 기본값을 single로 두는 이유는 CACHE_TYPE과 같다 - 기준선을 다시 잴 수 있어야 한다.
  # 측정·운영에서는 SEATMAP_STRATEGY=local로 띄운 뒤 nginx를 재시작한다.
  #
  # CACHE_TYPE과 별개인 이유: 군 사이에 카탈로그 캐시의 조건이 고정돼야 처리량 변화를
  # 좌석맵에 귀속할 수 있다. 실제로 이 분리 덕에 "분리 손해 -8.2%"와 "캐시 이득 +29.5%"를
  # 따로 적을 수 있었다.
  SEATMAP_STRATEGY: ${SEATMAP_STRATEGY:-single}

  # 보관할 회차 수 상한. **작업 집합보다 커야 한다** - 600회차를 200칸에 담은 군은
  # 적중률 33.5%에 +1.7%(산포 안)로 이득이 사라졌고, 축출 52,768건이 만든 쓰레기 때문에
  # 힙을 오히려 더 썼다(311 -> 497MB). 상한을 줄여서 힙을 아낄 수 없다. 회차당 약 420KB다.
  SEATMAP_MAX_ENTRIES: ${SEATMAP_MAX_ENTRIES:-1000}

  # 대기열 (Task 031). true면 RedisQueueGateway가 올라가 좌석 조회·예매 선점에 입장권을 요구한다.
  #
  # 기본값을 false로 둔다 — CACHE_TYPE과 같은 이유다. 대기열은 "유무에 따른 before/after"를
  # 비교해서 효과를 판정하는 대상이라(Task 033), 스택을 띄우는 것만으로 켜지면 무방비 기준선을
  # 다시 재기 어렵다. false면 DisabledQueueGateway가 전부 통과시킨다.
  #
  # 이 토글은 "대기열 기능이 애플리케이션에 있는가"이고, 실제로 줄을 세우는 회차는
  # schedules.queue_enabled가 정한다 — 둘 다 켜져야 동작한다.
  # 회차 플래그는 load-test/sql/04-enable-queue.sql로 켠다.
  QUEUE_ENABLED: ${QUEUE_ENABLED:-false}

  # Hikari 최대 커넥션 수 (Task 033에서 환경변수로 뺐다).
  #
  # ★ 왜 뺐는가 ★ application.yml에 Hikari 설정이 아예 없어서 **기본값 10**으로 돌고 있었고,
  # A군 측정에서 도착률 140/s에 풀이 소진되며 커넥션 대기(pending)가 생겼다. 같은 지점에서
  # 좌석 API p95가 64.5 -> 214.3ms로 꺾이니, "대기열이 좌석 API를 막아준다"는 결론 전에
  # 풀을 늘리는 쪽이 더 싼 레버인지 확인해야 했다.
  #
  # ★ 확인 결과: 풀은 벽이 아니었다 ★ 10/20/30 모두 약 365 req/s에서 똑같이 막혔고,
  # 140/s에서는 올린 쪽이 오히려 느렸다(p95 214 -> 280 -> 311ms). pending은 포화의 원인이
  # 아니라 증상이었고, 실제 벽은 CPU다 — 240/s에서 16코어 중 11.4개를 쓴다.
  # 그래서 이 변수는 기준선을 다시 재기 위한 측정용 손잡이로만 남는다.
  #
  # 상한은 Postgres의 max_connections(기본 100)다. BE가 2대라 한 대당 50을 넘기면 안 된다.
  # 기본값 10은 Hikari 기본값과 같아서, 이 변수를 넣는 것만으로는 거동이 바뀌지 않는다.
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${DB_POOL_SIZE:-10}

  # 한 틱에 입장시킬 인원과 틱 간격. Task 033이 포화점 측정으로 값을 정하는 대상이라
  # 환경변수로 뺀다 — 군을 바꿀 때마다 이미지를 다시 빌드하지 않으려면 필요하다.
  #
  # 주의: QUEUE_ADMIT_INTERVAL을 1s에서 크게 바꾸면 QueueAdmissionScheduler의
  # @SchedulerLock(lockAtLeastFor)도 같이 봐야 한다. 어노테이션에 계산식을 쓸 수 없어서
  # 두 값이 수동으로 묶여 있고, 안 맞추면 "설정은 5초인데 실제로는 1초마다 입장"이 된다.
  #
  # 그리고 이 값은 혼자 움직이지 않는다 — 예상 대기시간이 rank / (batch-size / interval)이라
  # 배치를 줄이면 화면의 ETA가 그만큼 길어진다.
  QUEUE_ADMIT_BATCH_SIZE: ${QUEUE_ADMIT_BATCH_SIZE:-50}
  QUEUE_ADMIT_INTERVAL: ${QUEUE_ADMIT_INTERVAL:-1s}

x-backend-healthcheck: &backend-healthcheck
  # actuator 도입(Task 025)으로 도메인 엔드포인트 의존을 끊었다. /actuator/health는
  # DataSourceHealthIndicator를 포함하므로 UP이면 Hikari 커넥션과 Flyway 마이그레이션까지
  # 끝났다는 뜻이다.
  #
  # 이 요청은 컨테이너 안에서 자기 자신(localhost:8080)을 때리므로 nginx의 /actuator 차단과
  # 무관하다. 차단은 "밖에서 들어오는 경로"에만 걸린다.
  #
  # curl은 jre-alpine 이미지에 없다. busybox wget을 쓰고 exec 형식(CMD)을 유지한다.
  test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
  # 헬스 요청도 http_server_requests에 uri="/actuator/health"로 잡히므로(Task 025)
  # 평상시 주기를 늘려 지표 오염을 원천에서 줄인다. 인스턴스가 2대가 되면 이 트래픽도 2배다.
  interval: 30s
  timeout: 3s
  retries: 3
  # start_period 동안은 start_interval(2s)로 자주 찔러서 compose up의 healthy 도달 시간을
  # 유지한다 (Docker 25+/compose 2.20+).
  start_period: 60s
  start_interval: 2s

services:
  postgres:
    image: postgres:15
    container_name: tikkit-postgres-prod
    # Task 040의 측정 축이다. 기본값은 postgres:15 이미지와 같은 128MB로 둔다 — 이 Task는
    # "올리면 좋아지는가"를 재는 것이고, 재기 전에 올려두면 before가 사라진다.
    #
    # shared_buffers는 CONFIG SET으로 못 바꾼다(재시작 필요). 그래서 환경변수로 뺐다.
    # track_io_timing은 pg_stat_database.blk_read_time을 쓰려면 켜야 한다 — 읽은 페이지 수와
    # 읽기에 쓴 시간은 다른 값이고, 007이 "버퍼 접근 수는 I/O의 대리지표가 아니다"로
    # 한 번 속은 자리라 시간 쪽을 직접 본다.
    #
    # pg_stat_statements는 Task 036이 켰다. 040이 포화 구간의 벽을 postgres CPU
    # 400%(4코어)로 특정했지만 프로세스 단위까지만 쪼갰고, 어느 쿼리가 그 4코어를 먹는지는
    # 못 봤다(012 8절이 "Task 036의 입구다"라고 적었다). shared_preload_libraries는
    # 재시작이 필요해서 CONFIG SET으로 못 켠다 — shared_buffers와 같은 이유로 여기 있다.
    #
    # track=all은 중첩 문장(함수·CTE 안쪽)까지 센다. top은 최상위만 세는데, 좌석맵의
    # 비용이 어느 층에 있는지를 모르는 상태에서 top을 고르면 "안 보이는 것"과 "없는 것"을
    # 구분할 수 없다. 켜 두는 쪽이 오버헤드를 조금 더 내지만 before/after 양쪽에 같이
    # 걸리므로 군 사이 비교는 그대로 성립한다.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
      - -c
      - track_io_timing=on
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # dev의 pgdata와 반드시 분리한다. db/seed의 버전(V1_1, V4_1, V5_1)이 db/migration
      # 사이에 끼어 있어서, 시드를 적용한 dev 볼륨에 시드 없는 prod를 붙이면 Flyway가
      # "applied migration not resolved locally"로 기동을 깬다. 반대 방향도 깨진다.
      - pgdata-prod:/var/lib/postgresql/data
    # dev compose에는 healthcheck가 없었다. prod는 backend가 DB 기동을 기다려야 하므로 필수다.
    # 값은 .github/workflows/ci.yml의 e2e 잡과 같게 맞췄다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # 호스트 포트를 열지 않는다 — backend가 compose 네트워크로 붙고, 디버깅은
    # `docker exec tikkit-postgres-prod psql ...`로 한다. dev의 5432와 충돌하지 않는다.
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: tikkit-redis-prod
    # 락·캐시·대기열은 날아가도 되는 데이터라 영속화를 끈다 (dev compose와 같은 판단).
    #
    # --- maxmemory (Task 029) ---
    # OOM 가드다. 상한이 없으면 Redis가 호스트 메모리를 먹다가 죽고, 그러면 세션까지 같이
    # 날아가 전 사용자가 로그아웃된다(005 9절의 "단일 Redis" 한계가 그대로 커진다).
    #
    # 조회 캐시 자체는 작다 — 공연 목록 항목이 690바이트, 상세·등급 가격도 수 KB다.
    # 카탈로그 전체가 올라와도 수십 MB라서 512MB를 채울 일이 없다(측정 중 피크 43.3MB,
    # 축출 0건). 좌석 배치 캐시를 넣었을 때는 회차당 384KB로 3,000회차면 1.15GB였는데,
    # 그 캐시는 기각했다 (docs/improvements/008-caching.md 4절).
    #
    # 그래서 allkeys-lru의 대가(**세션 키도 축출 대상이다**)는 지금 구조에서는 발동하지
    # 않는다. 다만 Task 031 대기열이 들어오면 ZSET이 커지므로 그때 다시 본다 — 그 시점에
    # 캐시·대기열용 Redis를 세션과 분리할지 판단한다. 분리가 공짜가 아닌 이유는
    # RedisConnectionFactory 빈이 두 개가 되면 Spring Session 자동설정의 @ConditionalOnBean이
    # 캐시 쪽 팩토리에도 걸려서 "캐시만 켠다"가 세션까지 켜버리기 때문이다
    # (Task 026이 만든 단일 토글 구조가 깨진다).
    command:
      - "redis-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--maxmemory"
      - "${REDIS_MAXMEMORY:-512mb}"
      - "--maxmemory-policy"
      - "allkeys-lru"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --- 백엔드 2대 (Task 026) ---
  #
  # container_name을 주지 않는다. 고정명은 애초에 복제가 불가능하고(그래서 Task 024가
  # "BE는 1개뿐"이라는 한계를 남겼다), 이제는 compose가 tikkit-prod-backend1-1 식으로 붙인다.
  # 로그를 볼 때는 컨테이너명이 아니라 서비스명으로 지목한다:
  #   docker compose -f docker-compose.prod.yml logs backend1 backend2
  #
  # --scale 대신 서비스를 2개 명시 선언한 이유: Prometheus의 static_configs는 타깃을
  # DNS 이름으로 적는데(backend1:8080), --scale로 늘린 복제본은 같은 서비스명 하나에
  # IP 여러 개로 붙어서 instance 라벨이 갈리지 않는다. 그러면 "어느 인스턴스가
  # 세션을 들고 있나"를 대시보드에서 구분할 수 없고, 그게 이 Task의 측정 전부다.
  #
  # 둘 다 build를 둔다. 같은 context·같은 image 태그라 두 번째 빌드는 전부 캐시 적중이다
  # (한쪽만 build를 두면 `up` 시점에 이미지가 없을 때 pull을 시도해서 실패한다).
  backend1:
    build:
      context: ./tikkit-back
    image: tikkit-backend:local
    environment: *backend-env
    # 호스트 포트를 열지 않는다. 외부 진입점은 nginx(80) 하나다 —
    # "/actuator/prometheus가 호스트에 열려 있다"는 004_3 9절의 지적이 이걸로 닫힌다.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *backend-healthcheck
    restart: unless-stopped

  backend2:
    build:
      context: ./tikkit-back
    image: tikkit-backend:local
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *backend-healthcheck
    restart: unless-stopped

  # --- 리버스 프록시 / 로드밸런서 (Task 026) ---
  # 설정과 설계 근거는 nginx/nginx.conf에 있다.
  nginx:
    image: nginx:1.27-alpine
    container_name: tikkit-nginx-prod
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 로컬 TLS 인증서 (Task 039_1). nginx.conf는 **단일 파일** 마운트라 같은 경로에
      # 인증서를 끼워 넣을 수 없어서 디렉터리를 따로 붙인다.
      # 비어 있으면 nginx가 `cannot load certificate`로 기동에 실패한다 —
      # `bash nginx/generate-local-cert.sh`를 먼저 한 번 돌려야 한다(산출물은 커밋 안 함).
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      # 유일한 외부 진입점. 브라우저는 여기만 본다.
      #
      # **둘 다 열어 둔다** (Task 039_1). 443은 브라우저 측정용(HTTP/2는 TLS가 선행),
      # 80은 k6 하네스용이다(`BASE_URL: http://nginx`). 리다이렉트를 걸면 포화 측정이
      # 죽는다. 비표준 포트를 쓰지 않는 이유는 nginx.conf의 Host 주석에 있다.
      - "80:80"
      - "443:443"
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      # service_healthy가 아니라 service_started다. frontend의 헬스체크가 "/" 페이지를
      # 받아보는데, 그 페이지는 Server Component가 API_BASE_URL(=nginx)로 BE를 호출한다.
      # 즉 frontend가 healthy해지려면 nginx가 먼저 떠 있어야 한다 — healthy를 기다리면
      # 서로를 기다리는 교착이 된다. 컨테이너가 떠 있으면 DNS 이름은 해석되고,
      # nginx는 업스트림 이름만 해석되면 기동한다.
      frontend:
        condition: service_started
    healthcheck:
      # 업스트림을 타지 않는 전용 경로다. "/"로 확인하면 프록시는 멀쩡한데
      # frontend가 아직 안 떴다는 이유로 unhealthy가 된다.
      #
      # localhost가 아니라 127.0.0.1이다 (Task 027에서 발견). 컨테이너 /etc/hosts에
      # "::1 localhost"가 있어서 busybox wget이 IPv6를 먼저 시도하는데, nginx의
      # `listen 80;`은 IPv4만 바인딩하므로 Connection refused가 난다.
      # 호스트에서 curl http://localhost/healthz는 200이라 겉으로는 멀쩡해 보인다.
      #
      # 이 버그는 Task 026부터 있었지만 nginx가 healthy해지기를 기다리는 서비스가
      # 없어서 드러나지 않았다. k6가 depends_on: service_healthy로 걸면서 처음 막혔다.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 2s
    restart: unless-stopped

  frontend:
    build:
      context: ./tikkit-front
    image: tikkit-frontend:local
    container_name: tikkit-frontend-prod
    environment:
      # 브라우저가 아니라 Next 서버가 쓰는 값이다(NEXT_PUBLIC_ 아님) → 컨테이너 주소를 준다.
      # lib/api/client.ts의 fallback("http://localhost:8080")은 컨테이너 안에서 자기 자신을
      # 가리키므로, 이 값이 빠지면 모든 API 호출이 NETWORK_ERROR가 된다.
      #
      # Task 026에서 backend:8080 -> nginx로 바꿨다. Next 서버의 API 호출이 로드밸런서를
      # 거치게 되고, 이 한 줄이 세션 불일치를 만드는 지점이다 — 같은 쿠키를 들고 나간
      # 요청들이 backend1과 backend2로 흩어진다.
      API_BASE_URL: http://nginx
      NODE_ENV: production
      # 브라우저가 보는 세션 쿠키에 Secure를 붙인다 (Task 039_1).
      #
      # 기본값이 false인 이유는 lib/session.ts 주석에 있다. 요약하면 **"http에서 깨지기
      # 때문"이 아니다** — 실제로 켜고 http://localhost로 재 보니 쿠키가 Secure로 저장되고
      # 로그인도 된다(Chrome이 localhost를 trustworthy origin으로 본다). 그 통과가
      # localhost 예외에 기대고 있어서 토글로 남긴 것이다.
      #
      # 측정·검증할 때 셸에서 켠다:
      #   SESSION_COOKIE_SECURE=true docker compose -f docker-compose.prod.yml up -d
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    # 호스트 포트를 열지 않는다. 브라우저는 nginx(80)로 들어온다.
    depends_on:
      backend1:
        condition: service_healthy
    # node:slim에는 curl도 wget도 없다. Node 22의 전역 fetch로 확인한다.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      # 15s -> 30s. "/" 페이지가 Server Component로 BE를 호출하는데 그 경로가 nginx를
      # 지나고, nginx는 이 컨테이너가 started가 된 뒤에 뜬다. 즉 처음 몇 번의 헬스체크는
      # nginx를 기다리다 실패하는 게 정상이다 (nginx의 depends_on 주석 참조).
      start_period: 30s
    restart: unless-stopped

  # --- 모니터링 (Task 025) ---
  # profiles로 묶어서 --profile monitoring을 줄 때만 뜬다. 평소 e2e 검증에는 필요 없고,
  # 별도 compose 파일로 쪼개는 방식(-f 2개)은 down에서 -f를 빼먹으면 orphan이 남는다.
  # compose down은 프로필과 무관하게 프로젝트 전체를 지우므로 이쪽이 안전하다.
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: tikkit-prometheus-prod
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 로컬 디스크를 지키기 위해 보존 기간을 줄인다 (기본 15d)
      - --storage.tsdb.retention.time=7d
      # k6가 부하 생성기 지표를 remote write로 밀어넣는다 (Task 027).
      # 이 플래그가 없으면 /api/v1/write가 404로 떨어지고, k6는 "메트릭을 보냈다"고
      # 말한 뒤 조용히 아무것도 남기지 않는다. 받는 쪽을 명시적으로 열어야 한다.
      #
      # 이걸 켜는 이유는 하나다 — k6의 p95와 BE의 Hikari/힙/GC를 **같은 타임라인에서**
      # 보려는 것. 부하 생성기 지표를 따로 보면 "p95가 튄 순간에 커넥션 풀이 어땠나"를
      # 눈으로 맞춰야 하고, 그게 004_3에서 가장 번거로웠던 부분이다.
      - --web.enable-remote-write-receiver
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata-prod:/prometheus
    ports:
      - "9090:9090"
    # depends_on을 걸지 않는다. Prometheus는 스크레이프를 계속 재시도하므로 backend보다
    # 먼저 떠도 되고, 오히려 backend 재기동에 묶이지 않는 쪽이 맞다.
    healthcheck:
      # 이 이미지에 /bin/wget이 있다 (distroless 변종이 아니다).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    container_name: tikkit-grafana-prod
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # 문서용 스크린샷을 로그인 없이 찍기 위한 익명 조회. 로컬 전용 스택이라 허용한다 —
      # 공개 환경에 올릴 땐(Task 034) 반드시 끈다.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # provider.yml의 path와 일치해야 한다. 대시보드의 진실은 이 JSON 파일이고,
      # UI에서 고친 내용은 재시작 시 덮인다 (allowUiUpdates: false).
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata-prod:/var/lib/grafana
    ports:
      # Grafana 기본 포트는 3000인데 tikkit-front가 그걸 쓴다 -> 호스트는 3001로 뺀다.
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # --- 부하 테스트 (Task 027) ---
  # up으로 띄우지 않고 `run --rm`으로 한 번씩 호출한다. 시나리오를 바꿔 여러 번 돌려야 하는
  # one-shot 작업이고, profiles에 넣어두면 평소 up/e2e에서는 아예 뜨지 않는다.
  #
  #   docker compose -f docker-compose.prod.yml --profile load run --rm k6 \
  #     run -o experimental-prometheus-rw --summary-export=/results/browse.json /scripts/browse.js
  #
  # 호스트 바이너리로 돌리지 않는 이유: compose 네트워크에 합류하면 nginx와 prometheus를
  # 서비스명으로 바로 쓸 수 있다. 호스트에서는 BE(8080)와 nginx 내부 경로에 접근할 수 없고
  # (포트를 퍼블리시하지 않는다), k6 설치 상태가 환경마다 달라져 재현성이 떨어진다.
  k6:
    image: grafana/k6:2.3.0
    container_name: tikkit-k6
    profiles: ["load"]
    environment:
      # 실제 사용자와 같은 경로로 들어간다 — nginx -> backend1/backend2 라운드로빈.
      # BE를 직격(backend1:8080)하면 로드밸런서와 keepalive 효과가 측정에서 빠진다.
      BASE_URL: http://nginx
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      # 기본값은 p(99)만 보낸다. 이 프로젝트의 before 수치가 전부 p95 기준이라 같이 보낸다.
      K6_PROMETHEUS_RW_TREND_STATS: "p(95),p(99),min,max,avg"
      # 실행마다 라벨을 달아 Grafana에서 회차를 구분한다 (keepalive on/off 비교에 쓴다).
      K6_PROMETHEUS_RW_LABELS: "run=${K6_RUN_LABEL:-local}"
    volumes:
      - ./load-test/k6:/scripts:ro
      - ./load-test/results:/results
    depends_on:
      nginx:
        condition: service_healthy
    # prometheus에는 depends_on을 걸지 않는다 (기존 관례). --profile monitoring을 같이 주면
    # 떠 있고, 안 줬으면 remote write만 실패하고 터미널 요약은 정상적으로 나온다.
    restart: "no"
volumes:
  # 이름에 -prod를 붙여 dev의 pgdata와 섞이지 않게 한다
  pgdata-prod:
  # 측정 직후 스택을 내려도 수치를 다시 읽을 수 있어야 해서 영속화한다 (보존 7일).
  promdata-prod:
  # 대시보드는 provisioning이 진실이지만, Grafana의 내부 DB(사용자·설정)는 여기 남는다.
  grafanadata-prod:
